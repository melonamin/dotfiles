# restore-denylist.conf — program basenames agterm will NOT re-run when "Restore running command"
# is on (it captures each pane's foreground command at quit + re-runs it on the next launch).
#
# The terminal multiplexers manage their OWN session restore, so re-running them would double up.
# One program basename per line; remove a line to let agterm restore that program.
tmux
screen
zellij