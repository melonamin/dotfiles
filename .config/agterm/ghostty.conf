# agterm-scoped ghostty config (<configDir>/ghostty.conf).
#
# Loaded after ~/.config/ghostty/config, so it overrides your global ghostty config for agterm
# ONLY. agterm's own UI settings (font, theme, background opacity) still win over anything here.
# Full reference: https://ghostty.org/docs/config
#
# Example — uncomment to try:
# cursor-style = bar
# mouse-hide-while-typing = true

# Omarchy theme sync. Omarchy atomically replaces this generated palette before
# invoking ~/.config/omarchy/hooks/theme-set; the hook reloads agterm afterward.
config-file = ?~/.config/omarchy/current/theme/ghostty.conf

# Herdr parity, from ~/.config/herdr/config.toml [ui].
confirm-close-surface = false   # herdr ui.confirm_close = false
mouse-hide-while-typing = true
# Two herdr settings need nothing here: advanced.scrollback_limit_bytes = 10000000
# is already ghostty's default scrollback-limit, and ui.copy_on_select matches the
# default copy-on-select = true (selection clipboard). Set it to `clipboard` if you
# want every selection to land in the system clipboard as well.
