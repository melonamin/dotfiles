# agterm keymap.conf — rebind built-in shortcuts and define custom shell commands.
#
# Fully commented: a fresh install rebinds NOTHING. Uncomment + edit a line to override, then
# reload via the command palette's "Reload Keymap" or Settings → Key Mapping → Reload.
#
# Override a built-in shortcut:
#   map <chord> <action>                  e.g.  map ctrl+shift+t new_session
#   chord = modifiers + key, e.g. ctrl+shift+p (ctrl / shift / alt / super)
#
# Define a custom command (also shown in the palette, marked "custom"):
#   command "<name>" [chord] <shell…>     e.g.  command "Git status" ctrl+shift+g git status
#   Tokens substituted into the shell line: {AGT_SESSION} {AGT_WINDOW} {AGT_SOCKET}
#   {AGT_SELECTION} {AGT_CWD}. For untrusted content prefer the QUOTED env form "$AGT_SELECTION".
#
# Rebindable built-in actions:
#   new_window
#   rename_window
#   delete_window
#   new_workspace
#   rename_workspace
#   delete_workspace
#   new_session
#   open_directory
#   rename_session
#   close_session
#   clear_status
#   increase_font_size
#   decrease_font_size
#   reset_font_size
#   toggle_split
#   toggle_scratch
#   toggle_search
#   toggle_sidebar
#   select_theme
#   toggle_flagged_view
#   toggle_flag
#   focus_workspace
#   focus_left_pane
#   focus_right_pane
#   previous_session
#   next_session
#   previous_attention_session
#   next_attention_session
#   first_session
#   last_session
#   quick_terminal
#   session_palette
#   command_palette
#   custom_command_palette

# ── tmux floating-popup parity ─────────────────────────────────────────────
# Ported from ~/.config/tmux/tmux.conf. Each overlay opens at the focused
# pane's working directory (agterm overlays inherit the session cwd, the
# equivalent of tmux's #{pane_current_path}) and closes when its program
# exits — press the tool's own quit key, exactly like the tmux display-popups.
# agtermctl is given by absolute path because a GUI-launched app's PATH does
# not include ~/.local/bin.

# Alt-t — per-session scratch shell. Uses agterm's native scratch (a
# full-coverage, keep-alive third shell toggled per session), the closest
# primitive to the tmux scratch-<parent> popup.
map alt+t toggle_scratch

# Alt-g — lazygit on the pane's repo. Quit lazygit (q) to close.
command "Lazygit (cwd)" alt+g /home/sasha/.local/bin/agtermctl session overlay open lazygit --size-percent 90

# Alt-r — revdiff: review the working tree's uncommitted changes. Quit (q) to close.
command "Revdiff (uncommitted)" alt+r /home/sasha/.local/bin/agtermctl session overlay open revdiff --size-percent 90

# Alt-n — nvim on the pane's cwd (:q to close). The command is a no-space
# wrapper script (agt-nvim-cwd → nvim .) because the keymap parser strips quotes
# from the shell line, so a quoted "nvim ." would reach agtermctl as a stray `.`.
command "Neovim (cwd)" alt+n /home/sasha/.local/bin/agtermctl session overlay open /home/sasha/.local/bin/agt-nvim-cwd --size-percent 90

# Alt-j — shared jot pad backed by ~/.local/share/jot.md (:q to close). Same
# no-space wrapper reason as Alt-n (agt-jot → nvim ~/.local/share/jot.md).
command "Jot pad" alt+j /home/sasha/.local/bin/agtermctl session overlay open /home/sasha/.local/bin/agt-jot --size-percent 80

# Note on chords: `agtermctl keymap list` prints the macOS (cmd-based) table, but
# this build dispatches from LinuxKeyboardPolicy.linuxDefaultChord, which is
# ctrl+shift-based and never uses Super — so Hyprland's Super bindings shadow
# nothing here. The shipped Linux chords are ctrl+shift+ n/w/t/o/q/d/m/j/f/s/g/p/i,
# ctrl+p, ctrl+`, plus the non-rebindable ctrl+tab, ctrl+pageup/pagedown,
# ctrl+1/ctrl+2, ctrl+shift+arrows and ctrl+=/ctrl+-/ctrl+0. Everything mapped
# below sits on a chord none of those claim.

# rename_session ships keyless on Linux (herdr had it on prefix+r).
map ctrl+shift+r rename_session

# ── herdr navigation parity ────────────────────────────────────────────────
# Same physical keys as ~/.config/herdr/config.toml. Herdr's agent-panel nav maps
# onto agterm's attention nav (the sessions whose status glyph wants attention),
# and its window/tab nav onto session nav. All four actions ship keyless on Linux;
# the shipped ctrl+pageup/pagedown and ctrl+1/ctrl+2 keep working alongside these.
# ctrl, alt and ctrl+alt arrows are free in Hyprland (checked with hyprctl binds).
map ctrl+up previous_attention_session   # herdr previous_agent
map ctrl+down next_attention_session     # herdr next_agent
map alt+left previous_session            # herdr previous_tab
map alt+right next_session               # herdr next_tab
map ctrl+alt+left focus_left_pane        # herdr focus_pane_left
map ctrl+alt+right focus_right_pane      # herdr focus_pane_right
# Herdr's alt+up / alt+down (previous/next workspace) have no built-in here — the
# navigation actions step between sessions, not workspaces. Left unbound.

# ── tmux/herdr prefix parity ───────────────────────────────────────────────
# `map` takes a single chord only (no leaders for built-ins), so the ctrl+space
# prefix is built from custom commands driving agtermctl, which does take leader
# sequences. Structural operations live here, matching how herdr put them behind
# its prefix. Most duplicate a native ctrl+shift chord on purpose — the prefix is
# the muscle memory, not a missing feature; zoom and close-split have no shipped
# Linux chord at all. Absolute path because a GUI-launched app's PATH has no
# ~/.local/bin.
command "New session" ctrl+space>c /home/sasha/.local/bin/agtermctl session new
command "New workspace" ctrl+space>shift+c /home/sasha/.local/bin/agtermctl workspace new
command "Toggle split" ctrl+space>v /home/sasha/.local/bin/agtermctl session split toggle
command "Close split" ctrl+space>x /home/sasha/.local/bin/agtermctl session split off
command "Zoom surface" ctrl+space>z /home/sasha/.local/bin/agtermctl surface zoom toggle
command "Toggle flag" ctrl+space>f /home/sasha/.local/bin/agtermctl session flag toggle
command "Reload agterm config" ctrl+space>q /home/sasha/.local/bin/agtermctl config reload; /home/sasha/.local/bin/agtermctl keymap reload
